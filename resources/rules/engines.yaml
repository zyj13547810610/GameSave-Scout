version: "2026.08.12-1"
rules:
  - id: tyrano
    label: TyranoScript
    variant: TyranoBuilder/TyranoScript
    experimental: false
    threshold: 0.70
    all:
      - op: path_exists
        path: data/system/Config.tjs
        weight: 0.45
    any:
      - op: path_exists
        path: tyrano/tyrano.js
        weight: 0.45
      - op: text_contains
        path: data/system/Config.tjs
        value: projectID
        weight: 0.25
    negative:
      - op: path_exists
        path: Editor.exe
        weight: -0.10
  - id: kirikiri
    label: KiriKiri 2/Z
    variant: null
    experimental: false
    threshold: 0.70
    all:
      - op: magic_at
        path: data.xp3
        value: "hex:5850330d0a200a1a8b6701"
        weight: 0.55
    any:
      - op: path_exists
        path: startup.tjs
        weight: 0.45
      - op: glob_exists
        path: "**/*.ks"
        weight: 0.35
  - id: choicescript
    label: ChoiceScript
    variant: null
    experimental: false
    threshold: 0.70
    all:
      - op: text_contains
        path: scenes/startup.txt
        value: "*title"
        weight: 0.55
      - op: path_exists
        path: scenes/choicescript_stats.txt
        weight: 0.45
  - id: srpg_studio
    label: SRPG Studio
    variant: null
    experimental: false
    threshold: 0.70
    all:
      - op: path_exists
        path: data.dts
        weight: 0.5
      - op: path_exists
        path: runtime.rts
        weight: 0.5
  - id: pixel_game_maker_mv
    label: Pixel Game Maker MV
    variant: null
    experimental: false
    threshold: 0.70
    all:
      - op: text_contains
        path: js/libs/AGtk.js
        value: Agtk
        weight: 0.6
      - op: path_exists
        path: package.json
        weight: 0.4
