    locations:
      - kind: glob
        path: <game>\Save*.rxdata
        category: save
        confidence: 0.96
        require_existing: true
  - id: rpg_maker_vx_saves
    label: RPG Maker VX 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://github.com/mkxp-z/mkxp-z/tree/826929eeb3ebc4b887c011604919217a790770f4
    engine_ids:
      - rpg_maker_vx
    locations:
      - kind: glob
        path: <game>\Save*.rvdata
        category: save
        confidence: 0.96
        require_existing: true
  - id: rpg_maker_vx_ace_saves
    label: RPG Maker VX Ace 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://github.com/mkxp-z/mkxp-z/tree/826929eeb3ebc4b887c011604919217a790770f4
    engine_ids:
      - rpg_maker_vx_ace
    locations:
      - kind: glob
        path: <game>\Save*.rvdata2
        category: save
        confidence: 0.96
        require_existing: true
  - id: rpg_maker_mv_saves
    label: RPG Maker MV 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://github.com/rpgtkoolmv/corescript/blob/182e31449707ba7e406db0485c44c2a9d11e2dcd/js/rpg_managers/StorageManager.js
    engine_ids:
      - rpg_maker_mv
    locations:
      - kind: glob
        path: <game>\save\*.rpgsave
        category: save
        confidence: 0.96
        require_existing: true
      - kind: glob
        path: <game>\www\save\*.rpgsave
        category: save
        confidence: 0.96
        require_existing: true
  - id: rpg_maker_mz_saves
    label: RPG Maker MZ 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://developer.rpgmakerweb.com/rpg-maker-mz/StorageManager.html
    engine_ids:
      - rpg_maker_mz
    locations:
      - kind: glob
        path: <game>\save\*.rmmzsave
        category: save
        confidence: 0.96
        require_existing: true
      - kind: glob
        path: <game>\www\save\*.rmmzsave
        category: save
        confidence: 0.96
        require_existing: true
  - id: nscripter_saves
    label: NScripter 存档与阅读状态
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://github.com/wcwac/em-onscripter/blob/d9d7239f61ba9bd1903884e2709dca5479993cab/ScriptHandler.cpp
    engine_ids:
      - nscripter
    locations:
      - kind: glob
        path: <game>\save*.dat
        category: save
        confidence: 0.94
        require_existing: true
      - kind: file
        path: <game>\envdata
        category: config
        confidence: 0.92
        require_existing: true
      - kind: file
        path: <game>\kidoku.dat
        category: config
        confidence: 0.92
        require_existing: true
  - id: godot_user_data
    label: Godot 用户数据目录
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html
    engine_ids:
      - godot
    locations:
      - kind: directory
        path: <winAppData>\Godot\app_userdata\{project_name}
        category: save
        confidence: 0.9
  - id: unity_user_data
    label: Unity 持久化数据与注册表
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://docs.unity3d.com/2023.1/Documentation/ScriptReference/Application-persistentDataPath.html
      - https://docs.unity3d.com/2020.2/Documentation/ScriptReference/PlayerPrefs.html
    engine_ids:
      - unity
    locations:
      - kind: directory
        path: <winLocalAppDataLow>\{company_name}\{product_name}
        category: save
        confidence: 0.94
      - kind: registry
        path: HKEY_CURRENT_USER\Software\{company_name}\{product_name}
        category: config
        confidence: 0.9
  - id: unreal_save_games
    label: Unreal Engine SaveGames
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://dev.epicgames.com/documentation/unreal-engine/saving-and-loading-your-game-in-unreal-engine
      - https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Core/FPaths
    engine_ids:
      - unreal
    locations:
      - kind: directory
        path: <winLocalAppData>\{project_name}\Saved\SaveGames
        category: save
        confidence: 0.92
