version: 2026.08.21-2
rules:
  - id: renpy_save_directory
    label: Ren'Py 存档目录
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://www.renpy.org/doc/html/config.html#var-config.save_directory
    engine_ids:
      - renpy
    locations:
      - kind: directory
        path: <winAppData>\RenPy\{renpy_save_directory}
        category: save
        confidence: 0.96
  - id: rpg_maker_2k_saves
    label: RPG Maker 2000/2003 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
      - https://github.com/EasyRPG/Player/blob/212f3466c9f276ff7cade5a5ead78d3a151343ac/src/scene_save.cpp
    engine_ids:
      - rpg_maker_2k
    locations:
      - kind: glob
        path: <game>\Save*.lsd
        category: save
        confidence: 0.96
        require_existing: true
  - id: rpg_maker_xp_saves
    label: RPG Maker XP 存档文件
    type: save_engine
    status: formal
    priority: 20
    enabled: true
    references:
