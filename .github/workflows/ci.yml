name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm --prefix frontend ci
      - run: python -m pytest
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src scripts
      - run: npm --prefix frontend run test:unit -- --run
      - run: npm --prefix frontend run type-check
      - run: npm --prefix frontend run build
      - name: Source startup smoke
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'gameshelf-smoke.json'
          $appRoot = Join-Path $env:RUNNER_TEMP 'GameShelf-source-smoke'
          python -m gameshelf.app --smoke-test --json-output $report --app-root $appRoot
          $payload = Get-Content -LiteralPath $report -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $payload.ok) { throw 'GameShelf source smoke failed.' }
