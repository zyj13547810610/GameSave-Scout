[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gameshelf"
version = "0.3.0"
description = "Portable Windows game library and save-location manager"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pefile>=2024.8.26,<2027",
  "Pillow>=11.3,<13",
  "pywebview>=6.2,<7",
  "PyYAML>=6.0.2,<7",
  "RapidFuzz>=3.13,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pyinstaller>=6.21,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
gameshelf = "gameshelf.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gameshelf"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
